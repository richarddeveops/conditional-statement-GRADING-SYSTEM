<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F4F3EF">
    <title>Secondary School Grading System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="secondary.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="index.html">Grade<span>Guide</span></a>
        <nav class="site-nav" aria-label="Main navigation">
            <a class="nav-link" href="secondary.html" aria-current="page">Secondary</a>
            <a class="nav-link" href="university.html">University</a>
            <a class="nav-link" href="polytechnic.html">Polytechnic</a>
        </nav>
    </header>

    <main class="page-main">
        <section class="grading-card" aria-labelledby="page-title">
            <p class="eyebrow">School grading scale</p>
            <h1 id="page-title">Secondary School</h1>
            <p class="page-description">Enter your score from 0 to 100 to check your grade.</p>
            <div class="score-field">
                <label for="score">Your score</label>
                <input type="number" id="score" min="0" max="100" step="any" placeholder="e.g. 75">
            </div>
            <button class="submit-button" id="check-grade" type="button" onclick="secondary()">Check grade <span aria-hidden="true">&rarr;</span></button>
            <p class="grade-result" id="displayarea" role="status" aria-live="polite"></p>
        </section>
    </main>

    <script src="secondary.js"></script>
</body>
</html>
